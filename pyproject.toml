[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "defi4-pol"
version = "0.1.0"
description = "Perfiles on-chain de wallets POL y agente MDP/Bellman reproducible"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "requests>=2.32",
    "web3>=7.0",
    "yfinance>=0.2.40",
    "plotly>=5.24",
    "kaleido>=0.2.1",
]

[project.optional-dependencies]
notebook = ["jupyterlab>=4.2"]

[project.scripts]
defi4 = "defi4.pipeline.wallets:main"

[tool.setuptools.packages.find]
include = ["defi4*"]
